[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fdd-workbench"
version = "0.1.0.dev0"
description = "Local financial due diligence analysis workbench."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0,<2",
    "polars>=1.0,<2",
    "openpyxl>=3.1,<4",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "typer>=0.12,<1",
]

[project.scripts]
fddw = "fdd_workbench.cli:app"

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11,<1"]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fdd_workbench = ["model/*.sql"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
